<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부여 글자비</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d2a3f;--bg2:#3b5668;--ink:#f3efe4;--jade:#cfe8da;--lotus:#e8789f;--gold:#e9c46a;--card:rgba(255,255,255,.09);
  --ui-scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Batang',serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#app{
  width:1280px;height:720px;
  position:relative;
  background:linear-gradient(#1d2a3f,#3b5668 85%,#4f6e72);
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  border-radius:calc(12px * var(--ui-scale));
  overflow:hidden;
  transform-origin:center center;
  will-change:transform;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(20px * var(--ui-scale)) calc(28px * var(--ui-scale));overflow:auto}
.screen.on{display:flex}
h1{font-size:calc(30px * var(--ui-scale));margin:calc(4px * var(--ui-scale)) 0;letter-spacing:.04em}
.sub{opacity:.78;margin:0 0 calc(12px * var(--ui-scale));font-size:calc(15px * var(--ui-scale))}
.row{display:flex;gap:calc(10px * var(--ui-scale));align-items:center;margin:calc(10px * var(--ui-scale)) 0}
.name{flex:1;padding:calc(10px * var(--ui-scale)) calc(14px * var(--ui-scale));border-radius:calc(12px * var(--ui-scale));background:var(--card);font-size:calc(19px * var(--ui-scale))}
button.btn{font-family:inherit;font-size:calc(16px * var(--ui-scale));padding:calc(10px * var(--ui-scale)) calc(18px * var(--ui-scale));border-radius:calc(12px * var(--ui-scale));border:0;background:var(--lotus);color:#2a1020;font-weight:700;cursor:pointer}
button.btn.ghost{background:var(--card);color:var(--ink)}
button.btn:disabled{opacity:.4}
#cfgwarn{background:#7a2e3a;padding:calc(10px * var(--ui-scale));border-radius:calc(10px * var(--ui-scale));display:none;margin-top:calc(10px * var(--ui-scale));font-size:calc(14px * var(--ui-scale))}

/* 가로형 입장 화면 */
#joinGrid{display:grid;grid-template-columns:calc(280px * var(--ui-scale)) 1fr;gap:calc(24px * var(--ui-scale));align-items:center;margin:auto 0}
#pvwrap{display:flex;flex-direction:column;gap:calc(10px * var(--ui-scale));align-items:center}
#pv{width:calc(130px * var(--ui-scale));height:calc(150px * var(--ui-scale));image-rendering:pixelated;background:var(--card);border-radius:calc(14px * var(--ui-scale))}
.prow{display:flex;gap:calc(6px * var(--ui-scale));align-items:center;margin:calc(8px * var(--ui-scale)) 0;flex-wrap:wrap}
.prow b{width:calc(64px * var(--ui-scale));font-weight:400;opacity:.8;font-size:calc(14px * var(--ui-scale))}
.opt{padding:calc(6px * var(--ui-scale)) calc(11px * var(--ui-scale));border-radius:calc(10px * var(--ui-scale));border:2px solid transparent;background:var(--card);color:var(--ink);font-family:inherit;font-size:calc(14px * var(--ui-scale));cursor:pointer}
.opt.sel{border-color:var(--lotus)}
.opt.sw{width:calc(30px * var(--ui-scale));height:calc(30px * var(--ui-scale));padding:0;border-radius:50%}
#enter{margin-top:calc(10px * var(--ui-scale));align-self:flex-start;min-width:calc(160px * var(--ui-scale))}

/* 가로형 대기실 */
#lobbyGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:calc(24px * var(--ui-scale));flex:1;min-height:0;align-items:start}
#lobbyList{display:flex;flex-wrap:wrap;gap:calc(8px * var(--ui-scale));margin:calc(10px * var(--ui-scale)) 0;max-height:calc(220px * var(--ui-scale));overflow:auto}
.chip{background:var(--card);padding:calc(6px * var(--ui-scale)) calc(12px * var(--ui-scale));border-radius:999px;font-size:calc(15px * var(--ui-scale))}
#admin{padding:calc(14px * var(--ui-scale));border:1px dashed var(--gold);border-radius:calc(12px * var(--ui-scale));display:none;background:rgba(16,22,36,.35)}
#admin input,#admin select{width:100%;padding:calc(9px * var(--ui-scale)) calc(10px * var(--ui-scale));border-radius:calc(8px * var(--ui-scale));border:0;margin-bottom:calc(8px * var(--ui-scale));font-family:inherit;font-size:calc(14px * var(--ui-scale))}
#admin .row{margin:calc(6px * var(--ui-scale)) 0 0}
#lobCount{font-size:calc(20px * var(--ui-scale));margin:calc(4px * var(--ui-scale)) 0 calc(6px * var(--ui-scale));color:var(--gold)}

/* 게임 화면 */
#game{padding:0}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(12px * var(--ui-scale)) calc(18px * var(--ui-scale)) calc(24px * var(--ui-scale));background:linear-gradient(rgba(16,22,36,.88),rgba(16,22,36,.35) 70%,transparent);z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:space-between;gap:calc(16px * var(--ui-scale))}
#hudLeft{display:flex;flex-direction:column;gap:calc(6px * var(--ui-scale));min-width:0;flex:1}
#hint{font-size:calc(18px * var(--ui-scale));line-height:1.35}
#slots{display:flex;gap:calc(7px * var(--ui-scale));flex-wrap:wrap}
.slot{min-width:calc(38px * var(--ui-scale));height:calc(40px * var(--ui-scale));border-radius:calc(8px * var(--ui-scale));border:2px solid var(--jade);display:grid;place-items:center;font-size:calc(22px * var(--ui-scale));color:#1d2a3f;background:transparent;padding:0 calc(4px * var(--ui-scale))}
.slot.f{background:var(--jade)}
#meta{display:flex;flex-direction:column;align-items:flex-end;gap:calc(4px * var(--ui-scale));font-size:calc(14px * var(--ui-scale));opacity:.9;white-space:nowrap}
canvas{width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(20,28,44,.9);padding:calc(24px * var(--ui-scale))}
#overlay.on{display:flex}
#ans{font-size:calc(52px * var(--ui-scale));font-weight:700;color:var(--gold);letter-spacing:.08em;margin:calc(4px * var(--ui-scale)) 0}
#desc{max-width:calc(560px * var(--ui-scale));line-height:1.5;font-size:calc(16px * var(--ui-scale))}
#board{margin-top:calc(12px * var(--ui-scale));text-align:left;font-size:calc(16px * var(--ui-scale));min-width:calc(280px * var(--ui-scale))}
#board div{display:flex;justify-content:space-between;gap:calc(24px * var(--ui-scale));padding:calc(3px * var(--ui-scale)) 0}
.px{image-rendering:pixelated}
#lb{position:absolute;left:calc(12px * var(--ui-scale));top:calc(102px * var(--ui-scale));z-index:2;pointer-events:none;font-size:calc(13px * var(--ui-scale));line-height:1.35;background:rgba(16,22,36,.55);border-radius:calc(10px * var(--ui-scale));padding:calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));min-width:calc(140px * var(--ui-scale));max-width:calc(210px * var(--ui-scale))}
#lb div{display:flex;align-items:center;gap:calc(5px * var(--ui-scale));white-space:nowrap;padding:calc(1px * var(--ui-scale)) 0}
#lb .me{color:var(--gold);font-weight:700}
#lb b{margin-left:auto;padding-left:calc(8px * var(--ui-scale))}
#lb .rk{width:calc(16px * var(--ui-scale));opacity:.7}
#abort{position:absolute;right:calc(14px * var(--ui-scale));bottom:calc(12px * var(--ui-scale));z-index:2;font-size:calc(13px * var(--ui-scale));padding:calc(7px * var(--ui-scale)) calc(12px * var(--ui-scale));display:none}
</style>
</head>
<body>
<div id="app">
  <!-- 입장 화면 -->
  <section class="screen on" id="join">
    <h1>부여 글자비</h1>
    <p class="sub">하늘에서 내려오는 글자를 캐릭터 머리로 받아 부여의 명소를 맞혀 보세요.</p>
    <div id="joinGrid">
      <div id="pvwrap">
        <canvas id="pv" width="20" height="23"></canvas>
        <div class="name" id="nameBox" style="width:100%;text-align:center"></div>
        <button class="btn ghost" id="reroll" style="font-size:calc(14px * var(--ui-scale));padding:calc(8px * var(--ui-scale)) calc(14px * var(--ui-scale))">이름 다시 받기</button>
      </div>
      <div>
        <div id="picker"></div>
        <button class="btn" id="enter">입장하기</button>
        <div id="cfgwarn">firebaseConfig 값을 먼저 채워 주세요.</div>
      </div>
    </div>
  </section>

  <!-- 대기실 -->
  <section class="screen" id="lobby">
    <h1>대기실</h1>
    <p class="sub" id="lobMsg"></p>
    <div id="lobbyGrid">
      <div>
        <div id="lobCount"></div>
        <div id="lobbyList"></div>
        <p class="sub" style="margin-top:calc(10px * var(--ui-scale))">정답에 없는 글자를 머리로 받으면 -5점이에요.</p>
      </div>
      <div id="admin">
        <div style="margin-bottom:calc(8px * var(--ui-scale));font-weight:700">관리자 모드</div>
        <input id="pass" type="password" placeholder="관리자 비밀번호">
        <select id="qcount">
          <option value="10">10문제</option>
          <option value="15" selected>15문제</option>
          <option value="20">20문제</option>
          <option value="99">전체</option>
        </select>
        <div class="row">
          <button class="btn" id="startBtn">게임 시작</button>
          <button class="btn ghost" id="resetBtn">대기실로 초기화</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 게임 -->
  <section class="screen" id="game">
    <div id="hud">
      <div id="hudLeft">
        <div id="hint"></div>
        <div id="slots"></div>
      </div>
      <div id="meta"><span id="qno"></span><span id="myscore"></span></div>
    </div>
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="lb"></div>
    <button class="btn ghost" id="abort">대기실로</button>
    <div id="overlay">
      <div id="ovTitle" class="sub"></div>
      <div id="ans"></div>
      <div id="desc"></div>
      <div id="board"></div>
      <button class="btn" id="backBtn" style="display:none;margin-top:calc(14px * var(--ui-scale))">대기실로 돌아가기</button>
    </div>
  </section>
</div>

const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

function letterAt(seed,qi,i){
  const ans=[...QUESTIONS[qi].a],N=ans.length+EXTRA,r=Math.floor(i/N),k=seed+"_"+qi+"_"+r;
  if(!roundCache[k]){const rGen=mul(seed*31+r*7919+qi);const pool=allSyl.filter(c=>!ans.includes(c));
    const arr=[...ans];for(let j=0;j<EXTRA;j++)arr.push(pool[Math.floor(rGen()*pool.length)]);
    for(let j=arr.length-1;j>0;j--){const m=Math.floor(rGen()*(j+1));[arr[j],arr[m]]=[arr[m],arr[j]]}roundCache[k]=arr}
  return roundCache[k][i%N];
}

      const nv=s.val()||{};

/* 획득 / 정답 판정 */
const pending=new Set(),claiming=new Set();
const Q=i=>state&&state.order?QUESTIONS[state.order[i]]:null;
function counts(){const c={};Object.values(collected).forEach(v=>{if(v&&v.c)c[v.c]=(c[v.c]||0)+1});return c}
function renderSlots(){
  if(!state||!state.order)return;
  const q=Q(state.qIndex);if(!q)return;
  const ans=[...q.a],c=counts(),tmp={...c};
  $('#slots').innerHTML=ans.map(ch=>{
    const ok=tmp[ch]>0;
    if(ok)tmp[ch]--;
    return `<div class="slot ${ok?'f':''}">${ok?ch:''}</div>`;
  }).join('');
}
function checkDone(){
  if(!state||state.status!=='playing')return;
  const q=Q(state.qIndex);if(!q)return;
  const need={};[...q.a].forEach(ch=>need[ch]=(need[ch]||0)+1);
  const c=counts();
  const complete=Object.keys(need).every(ch=>(c[ch]||0)>=need[ch]);
  if(complete){
    const cur=state.qIndex;
    runTransaction(base('state'),s=>{
      if(!s||s.status!=='playing'||s.qIndex!==cur)return s;
      return {...s,status:'answer',answerAt:now()};
    });
  }
}
async function claim(i,ch,x,y){
  if(!state||state.status!=='playing')return;
  if(pending.has(i)||claiming.has(i)||collected[i])return;
  claiming.add(i);
  pending.add(i);
  const qIdx=state.qIndex;
  const q=Q(qIdx);
  try{
    const res=await runTransaction(base(`collected/${qIdx}/${i}`),v=>v===null?{c:ch,by:uid}:undefined);
    if(res.committed){
      const curCounts={};
      Object.entries(collected).forEach(([k,v])=>{if(+k!==i&&v&&v.c)curCounts[v.c]=(curCounts[v.c]||0)+1});
      const need=q?[...q.a].filter(z=>z===ch).length:0;
      const before=curCounts[ch]||0;
      const delta=need===0?-5:(before<need?10:0);
      if(delta>0)await runTransaction(base(`players/${uid}/score`),s=>(s||0)+10);
      else if(delta<0)await runTransaction(base(`players/${uid}/score`),s=>Math.max(0,(s||0)-5));
      fx.push({x,y,t:performance.now(),ch,mine:true,delta});
    }else{
      fx.push({x,y,t:performance.now(),ch});
    }
  }catch(_){
    pending.delete(i);
  }finally{
    claiming.delete(i);
  }
}
let advTry=0;
function advance(){
  if(!state||state.status!=='answer'||typeof state.answerAt!=='number'||now()<state.answerAt+ANS_MS||Date.now()-advTry<1000)return;
  advTry=Date.now();const cur=state.qIndex;
  runTransaction(base('state'),s=>{
    if(!s||s.status!=='answer'||s.qIndex!==cur)return s;
    if(cur+1>=s.order.length)return {...s,status:'finished'};
    return {
      status:'playing',
      qIndex:cur+1,
      order:s.order,
      seed:1+Math.floor(Math.random()*1e6),
      startedAt:now()+3500
    };
  });
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){dir=-1;tx=null}
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){dir=1;tx=null}
});
addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))dir=0});
const ptr=e=>{const r=cv.getBoundingClientRect();tx=((e.clientX-r.left)/r.width)*W;dir=0};
cv.addEventListener('pointerdown',ptr);
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')ptr(e)});

/* 렌더 루프 */
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  const opx=px;
  if(dir!==0)px+=dir*680*dt;
  else if(tx!==null)px+=(tx-px)*Math.min(1,dt*14);
  px=Math.max(50,Math.min(W-50,px));
  if(Math.abs(px-opx)>.3){meMove.m=performance.now();meMove.d=Math.sign(px-opx)}
  if(db&&uid&&Date.now()-lastPush>100&&Math.round(px)!==lastX){
    lastPush=Date.now();lastX=Math.round(px);set(base('pos/'+uid),lastX).catch(()=>{});
  }
  draw();advance();requestAnimationFrame(loop);
}
function draw(){
  if(late){g.clearRect(0,0,W,H);return}
  g.clearRect(0,0,W,H);
  g.fillStyle='rgba(233,196,106,.9)';g.beginPath();g.arc(1060,155,34,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.06)';g.fillRect(0,PY+25,W,H);
  const act=Object.entries(players).filter(([,p])=>!p.wait),n=Math.max(1,act.length);
  const S=Math.max(.55,Math.min(1.1,Math.pow(8/n,.6))),L=.75+.25*S;
  const fnt=k=>`700 ${Math.round(28*L*k)}px 'Gowun Batang',serif`;
  g.textAlign='center';g.textBaseline='middle';
  if(state&&state.status==='playing'&&typeof state.startedAt==='number'&&now()>=state.startedAt){
    const el=now()-state.startedAt,hi=Math.floor(el/SPAWN),lo=Math.max(0,Math.floor((el-FALL)/SPAWN));
    const q=Q(state.qIndex);
    if(q){
      g.font=fnt(1);
      for(let i=lo;i<=hi;i++){
        if(collected[i]||pending.has(i))continue;
        const y=(el-i*SPAWN)/FALL*(PY+35)-20;
        if(y<-30||y>H+30)continue;
        const x=xAt(state.seed,i),ch=letterAt(state.seed,state.order[state.qIndex],i);
        g.fillStyle='#cfe8da';g.beginPath();g.arc(x,y,26*L,0,7);g.fill();
        g.strokeStyle='#e8789f';g.lineWidth=2.5;g.stroke();
        g.fillStyle='#1d2a3f';g.fillText(ch,x,y+1);
        if(hitHead(x,y,px,S,L))claim(i,ch,x,y);
      }
    }
  }
  for(let k=fx.length-1;k>=0;k--){
    const f=fx[k],a=(performance.now()-f.t)/450;if(a>=1){fx.splice(k,1);continue}
    g.globalAlpha=1-a;g.strokeStyle=f.mine?(f.delta<0?'#ff6b6b':'#e9c46a'):'#e8789f';g.lineWidth=3;
    g.beginPath();g.arc(f.x,f.y,26*L*(1+a*.8),0,7);g.stroke();
    g.fillStyle='#cfe8da';g.font=fnt(1);g.fillText(f.ch,f.x,f.y+1);
    if(f.mine){
      g.fillStyle=f.delta<0?'#ff6b6b':'#e9c46a';g.font=fnt(.8);
      g.fillText(f.delta>0?'+10':f.delta<0?'-5':'+0',f.x,f.y-30*L-a*30);
    }
    g.globalAlpha=1;
  }
  act.sort((a,b)=>(a[0]===uid)-(b[0]===uid)).forEach(([k,p])=>{
    const mine=k===uid,tx0=posMap[k]??W/2,v=vis[k]||(vis[k]={x:tx0,m:0,d:1});
    if(!mine){const o=v.x;v.x+=(tx0-v.x)*.3;if(Math.abs(v.x-o)>.25){v.m=performance.now();v.d=Math.sign(v.x-o)}}
    const dx=mine?px:v.x;g.globalAlpha=mine?1:.72;
    if(p.look)drawChar(g,spriteCv(p.look),dx,mine?meMove:v,S);
    if(mine||n<=10){g.font=`${mine?15:13}px 'Gowun Batang',serif`;g.fillStyle=mine?'#e9c46a':'#f3efe4';g.fillText(p.name,dx,PY+34)}
    g.globalAlpha=1;
    if(mine&&n>1){const ty=PY+20-88*S-10;g.fillStyle='#e9c46a';g.beginPath();g.moveTo(dx-7,ty-10);g.lineTo(dx+7,ty-10);g.lineTo(dx,ty);g.fill()}
  });
  if(state&&state.status==='playing'&&typeof state.startedAt==='number'&&now()<state.startedAt){
    const sec=Math.max(1,Math.ceil((state.startedAt-now())/1000));
    g.fillStyle='rgba(16,22,36,.55)';g.fillRect(0,0,W,H);
    g.textAlign='center';g.textBaseline='middle';g.fillStyle='#e9c46a';g.font="700 120px 'Gowun Batang',serif";g.fillText(sec,W/2,H/2-15);
    g.font="22px 'Gowun Batang',serif";g.fillStyle='#f3efe4';g.fillText('곧 시작합니다',W/2,H/2+85);
  }
  if(players[uid])$('#myscore').textContent=`내 점수 ${players[uid].score||0}`;
}
</script>
</body>
